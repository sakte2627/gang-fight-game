<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Gang Fight Game</title>\n    <script src=\"https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js\"></script>\n    <style>\n        * {\n            margin: 0;\n            padding: 0;\n            box-sizing: border-box;\n        }\n        body {\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            min-height: 100vh;\n            background: #111;\n            font-family: 'Arial', sans-serif;\n            color: #fff;\n        }\n        #game-container {\n            position: relative;\n            display: flex;\n            gap: 20px;\n        }\n        #game {\n            border: 3px solid #fff;\n        }\n        #ui {\n            position: absolute;\n            top: 10px;\n            left: 10px;\n            color: #fff;\n            font-size: 14px;\n            z-index: 10;\n            background: rgba(0, 0, 0, 0.8);\n            padding: 15px;\n            border: 2px solid #00FF00;\n            border-radius: 5px;\n            max-width: 250px;\n        }\n        .stat {\n            margin-bottom: 8px;\n            padding: 5px;\n            background: rgba(0, 0, 0, 0.5);\n            border-left: 3px solid #00FF00;\n        }\n        .section-title {\n            background: #00FF00;\n            color: #000;\n            padding: 5px;\n            margin-top: 10px;\n            margin-bottom: 5px;\n            font-weight: bold;\n            border-radius: 3px;\n        }\n        .control-key {\n            background: #333;\n            padding: 3px 6px;\n            border-radius: 3px;\n            font-weight: bold;\n            color: #FFD700;\n            display: inline-block;\n            margin-right: 5px;\n        }\n        #controls {\n            position: absolute;\n            top: 10px;\n            right: 10px;\n            background: rgba(0, 0, 0, 0.8);\n            padding: 15px;\n            border: 2px solid #0099FF;\n            border-radius: 5px;\n            max-width: 300px;\n            font-size: 12px;\n        }\n        .control-item {\n            margin-bottom: 8px;\n            padding: 5px;\n            background: rgba(0, 0, 0, 0.5);\n        }\n    </style>\n</head>\n<body>\n    <div id=\"game-container\">\n        <div id=\"ui\"></div>\n        <div id=\"controls\"></div>\n    </div>\n    <script src=\"js/config.js\"></script>\n    <script src=\"js/player.js\"></script>\n    <script src=\"js/enemy.js\"></script>\n    <script src=\"js/combat.js\"></script>\n    <script src=\"js/gang.js\"></script>\n    <script src=\"js/gameState.js\"></script>\n    <script src=\"js/scenes/mainMenu.js\"></script>\n    <script src=\"js/scenes/shopScene.js\"></script>\n    <script src=\"js/scenes/gameScene.js\"></script>\n    <script src=\"js/main.js\"></script>\n</body>\n</html>"
